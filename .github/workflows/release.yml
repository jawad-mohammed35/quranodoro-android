name: Signed APK release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/release-signing.jks
    steps:
      - uses: actions/checkout@v4
      - name: Require production signing
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure KEYSTORE_BASE64 before publishing a production release.'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: bash scripts/install-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Validate tag and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle.kts
      - name: Check and build production APK
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease
      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "Quranodoro-${GITHUB_REF_NAME}.apk"
          sha256sum "Quranodoro-${GITHUB_REF_NAME}.apk" > "Quranodoro-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Quranodoro-${{ github.ref_name }}
          path: Quranodoro-*.apk*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Quranodoro-${GITHUB_REF_NAME}.apk" "Quranodoro-${GITHUB_REF_NAME}.apk.sha256" --verify-tag --title "Quranodoro $GITHUB_REF_NAME" --generate-notes
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$KEYSTORE_PATH"
