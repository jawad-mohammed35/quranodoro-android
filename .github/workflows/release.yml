name: Signed APK release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: bash scripts/install-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Validate tag and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "versionName = \"$VERSION\"" app/build.gradle.kts
      - name: Check and build production APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/quranodoro-release.jks
        run: |
          set -eu
          : "${KEYSTORE_BASE64:?Missing keystore}" "${KEYSTORE_PASSWORD:?Missing store password}"
          : "${KEY_ALIAS:?Missing alias}" "${KEY_PASSWORD:?Missing key password}"
          umask 077
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          unset KEYSTORE_BASE64
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Verify release signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: 49dedb9ec26f0998ad9c570360a1a06ff88beddde5bffc313bdfbc94682f4c45' signer.txt
          cp app/build/outputs/apk/release/app-release.apk "Quranodoro-${GITHUB_REF_NAME}.apk"
          sha256sum "Quranodoro-${GITHUB_REF_NAME}.apk" > "Quranodoro-${GITHUB_REF_NAME}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Quranodoro-${{ github.ref_name }}
          path: Quranodoro-*.apk*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Quranodoro-${GITHUB_REF_NAME}.apk" "Quranodoro-${GITHUB_REF_NAME}.apk.sha256" --verify-tag --title "Quranodoro $GITHUB_REF_NAME" --generate-notes
